<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>بندول نيوتن – لوحة تحكم متقدمة</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background-color: #110a05; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; }

        /* ====== لوحة البيانات (الجدول السفلي) ====== */
        #data-panel {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 92%; max-width: 1100px; max-height: 220px; overflow-y: auto;
            background: rgba(10, 10, 15, 0.78); backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 215, 140, 0.25); border-radius: 16px;
            padding: 12px 16px; color: #eee; z-index: 50; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }
        #data-panel::-webkit-scrollbar { width: 6px; }
        #data-panel::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); border-radius: 8px; }
        #data-panel::-webkit-scrollbar-thumb { background: #d4a373; border-radius: 8px; }
        #data-panel table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: center; direction: ltr; }
        #data-panel th {
            background: rgba(212, 163, 115, 0.15); color: #ffd78c; font-weight: 600;
            padding: 8px 4px; border-bottom: 2px solid rgba(212, 163, 115, 0.4);
            position: sticky; top: 0; backdrop-filter: blur(4px); z-index: 2;
        }
        #data-panel td { padding: 6px 4px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); font-family: 'Courier New', monospace; font-size: 12px; color: #eee; }
        #data-panel tr:hover td { background: rgba(212, 163, 115, 0.15); }

        /* ====== HUD العلوي ====== */
        #hud-stats {
            position: fixed; top: 20px; left: 20px; background: rgba(10, 10, 15, 0.60);
            backdrop-filter: blur(10px); border: 1px solid rgba(255, 215, 140, 0.2);
            border-radius: 14px; padding: 16px 22px; color: #eee; font-size: 13px; z-index: 60; min-width: 210px;
        }
        #hud-stats h4 { margin: 0 0 10px 0; color: #ffd78c; font-weight: 600; font-size: 14px; border-bottom: 1px solid rgba(212, 163, 115, 0.3); padding-bottom: 6px; text-align: center; }
        .hud-row { display: flex; justify-content: space-between; margin: 5px 0; }
        .hud-label { color: rgba(255, 255, 255, 0.6); }
        .hud-value { font-family: 'Courier New', monospace; font-weight: 600; color: #fff; }

        /* ====== زر إعادة الضبط السريع ====== */
        #reset-btn {
            position: fixed; bottom: 250px; right: 24px; background: rgba(212, 163, 115, 0.15);
            backdrop-filter: blur(6px); border: 1px solid rgba(212, 163, 115, 0.4); border-radius: 40px;
            padding: 10px 18px; color: #ffd78c; font-size: 13px; font-weight: 600; cursor: pointer; z-index: 70;
        }
        #reset-btn:hover { background: #d4a373; border-color: #ffd78c; color: #110a05; transform: scale(1.03); }

        .lil-gui {
            --background-color: rgba(20, 20, 25, 0.9) !important;
            --text-color: #eee !important;
            --title-background-color: #2c1a04 !important;
            --widget-color: #1a1a22 !important;
            --hover-color: #3a3a44 !important;
            --focus-color: #ffd78c !important;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19.2/dist/lil-gui.umd.min.js"></script>
</head>

<body>

    <div id="hud-stats">
        <h4>⚙️ بندول نيوتن</h4>
        <div class="hud-row"><span class="hud-label">الطاقة الكلية</span><span class="hud-value" id="hud-energy">—</span></div>
        <div class="hud-row"><span class="hud-label">أقصى زاوية</span><span class="hud-value" id="hud-angle">—</span></div>
        <div class="hud-row"><span class="hud-label">السرعة المماسية</span><span class="hud-value" id="hud-speed">—</span></div>
        <div class="hud-row"><span class="hud-label">أقصى شد (لكل سلك)</span><span class="hud-value" id="hud-tension">—</span></div>
    </div>

    <button id="reset-btn">⟳ إعادة ضبط سريع</button>

    <div id="data-panel">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>θ (rad)</th>
                    <th>ω (rad/s)</th>
                    <th>X (m)</th>
                    <th>Y (m)</th>
                    <th>E<sub>k</sub> (J)</th>
                    <th>E<sub>p</sub> (J)</th>
                    <th style="color:#28a745;">E<sub>total</sub> (J)</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <script type="module" src="./main.js"></script>

</body>
</html>
